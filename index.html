<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PJEENGame - หน้าหลัก</title>

  <!-- Bootstrap 5 + Bootstrap Icons + ฟอนต์ -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Serif+SC:wght@700&display=swap" rel="stylesheet">

  <!-- ============================================================
       CSS ของหน้านี้
       ส่วน [ส่วนกลาง] ใช้เหมือนกันทุกหน้า คัดลอกไปวางได้เลย
       ส่วน [เฉพาะหน้า] เปลี่ยนตามแต่ละหน้า
       ============================================================ -->
  <style>
    /* ---------- [ส่วนกลาง] ตัวแปรสี / พื้นฐาน ---------- */
    :root {
      --paper: #EEF2EF;
      --card:  #FFFFFF;
      --ink:   #1D2B2A;
      --muted: #64736F;
      --line:  #D6DFDA;
      --jade:  #2F7D6D;
      --seal:  #C8372D;
      --dock-h: 66px;
    }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Sans Thai', system-ui, sans-serif;
      /* เว้นที่ด้านล่างไม่ให้ navbar บังเนื้อหา */
      padding-bottom: calc(var(--dock-h) + 40px + env(safe-area-inset-bottom));
      animation: pageIn .35s ease-out both;
    }
    @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
    .app-wrap { max-width: 720px; }
    .hanzi { font-family: 'Noto Serif SC', serif; }

    /* ---------- [ส่วนกลาง] Header + โลโก้ ---------- */
    .topbar {
      position: sticky; top: 0; z-index: 1020;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      padding-top: env(safe-area-inset-top);
    }
    .brand { display: flex; align-items: center; gap: 10px; padding: 12px 0; text-decoration: none; color: var(--ink); }
    .brand-mark {
      width: 34px; height: 34px; border-radius: 6px;
      background: var(--seal); color: #fff;
      display: grid; place-items: center;
      font-size: 20px; line-height: 1;
      transform: rotate(-4deg);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.35);
    }
    .brand-name { font-size: 1.2rem; font-weight: 700; letter-spacing: .2px; }

    /* ---------- [ส่วนกลาง] การ์ด / ปุ่ม ---------- */
    .card-box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
    }
    .btn-seal {
      background: var(--seal); color: #fff; border: 0;
      border-radius: 12px; padding: .7rem 1.2rem; font-weight: 700;
      transition: background .2s, transform .12s;
    }
    .btn-seal:hover { background: #B02F26; color: #fff; }
    .btn-seal:active { transform: scale(.97); }
    a:focus-visible, .btn:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }

    /* ---------- [ส่วนกลาง] Bottom Navbar ---------- */
    .dock {
      position: fixed; z-index: 1030;
      left: 50%; transform: translateX(-50%);
      bottom: calc(12px + env(safe-area-inset-bottom));
      width: min(440px, calc(100% - 24px));
      height: var(--dock-h);
      padding: 6px;
      display: flex;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(29, 43, 42, .12);
    }
    /* แคปซูลที่เลื่อนไปตามเมนูที่เลือก */
    .dock-pill {
      position: absolute; top: 6px; bottom: 6px; left: 6px;
      width: calc((100% - 12px) / 5);
      background: var(--ink);
      border-radius: 18px;
      transition: transform .38s cubic-bezier(.34, 1.4, .5, 1);
    }
    .dock-item {
      position: relative; z-index: 1;
      flex: 1 1 0;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted); text-decoration: none;
      border-radius: 18px; overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: color .25s, transform .12s;
    }
    .dock-item:active { transform: scale(.92); }              /* เอฟเฟกต์ย่อตอนกด */
    .dock-item:focus-visible { outline: 2px solid var(--jade); outline-offset: -2px; }
    .dock-item i {
      font-size: 22px; line-height: 1;
      transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
    }
    .dock-item .lbl {
      position: absolute; bottom: 6px;
      font-size: 11px; line-height: 1.2; font-weight: 500; white-space: nowrap;
      opacity: 0; transform: translateY(5px);
      transition: opacity .25s, transform .25s;
    }
    .dock-item.active { color: #fff; }
    .dock-item.active i { transform: translateY(-8px); }       /* ไอคอนเด้งขึ้น */
    .dock-item.active .lbl { opacity: 1; transform: none; }    /* ป้ายชื่อค่อยๆ โผล่ */
    /* คลื่น ripple ตอนกด */
    .ripple {
      position: absolute; border-radius: 50%; pointer-events: none;
      background: rgba(47, 125, 109, .28);
      transform: scale(0);
      animation: ripple .55s ease-out forwards;
    }
    .dock-item.active .ripple { background: rgba(255, 255, 255, .3); }
    @keyframes ripple { to { transform: scale(1); opacity: 0; } }

    /* ---------- [เฉพาะหน้า] หน้าหลัก ---------- */
    .hero { display: flex; align-items: center; gap: 16px; }
    .seal {
      flex: none; width: 76px; height: 76px; border-radius: 8px;
      background: var(--seal); color: #fff;
      display: grid; place-items: center;
      font-size: 44px; line-height: 1;
      transform: rotate(-3deg);
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
    }
    .hero-label { color: var(--muted); font-size: .9rem; margin: 0; }
    .hero-main  { font-size: 1.7rem; font-weight: 700; line-height: 1.3; margin: 0; }
    .hero-sub   { color: var(--muted); margin: 0; }

    .mini { text-align: left; height: 100%; }
    .mini i { color: var(--jade); font-size: 1.2rem; }
    .mini-value { font-size: 1.35rem; font-weight: 700; line-height: 1.3; margin: 4px 0 0; }
    .mini-label { color: var(--muted); font-size: .8rem; margin: 0; }

    .chart-title { font-weight: 700; margin: 0; }
    .chart-sub   { color: var(--muted); font-size: .85rem; margin: 0 0 12px; }
    .bars { display: flex; align-items: flex-end; gap: 8px; height: 140px; }
    .bar-col { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
    .bar-val { font-size: .8rem; color: var(--muted); min-height: 1.2em; }
    .bar {
      width: 100%; max-width: 34px; height: 4px;
      background: var(--jade); border-radius: 6px 6px 3px 3px;
      transition: height .6s cubic-bezier(.22, 1, .36, 1);
    }
    .bar.zero  { background: var(--line); }
    .bar.today { background: var(--seal); }
    .bar-day { font-size: .8rem; color: var(--muted); }
    .bar-col.is-today .bar-day { color: var(--ink); font-weight: 700; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>

<body>

  <!-- ================= [ส่วนกลาง] Header + โลโก้ ================= -->
  <header class="topbar">
    <div class="container app-wrap">
      <a class="brand" href="index.html" aria-label="PJEENGame หน้าหลัก">
        <span class="brand-mark hanzi" aria-hidden="true">学</span>
        <span class="brand-name">PJEENGame</span>
      </a>
    </div>
  </header>

  <!-- ================= [เฉพาะหน้า] เนื้อหาหน้าหลัก ================= -->
  <main class="container app-wrap py-3">

    <!-- ส่วนสรุปวันนี้ -->
    <section class="card-box mb-3">
      <div class="hero">
        <div class="seal hanzi" aria-hidden="true">今</div>
        <div class="flex-grow-1">
          <p class="hero-label">วันนี้</p>
          <p class="hero-main" id="heroMain">-</p>
          <p class="hero-sub" id="heroSub"></p>
        </div>
      </div>
      <a id="cta" class="btn btn-seal w-100 mt-3" href="game.html">เล่นเกม</a>
    </section>

    <!-- การ์ดตัวเลขย่อย 3 ใบ -->
    <section class="row g-2 mb-3">
      <div class="col-4">
        <div class="card-box mini">
          <i class="bi bi-collection"></i>
          <p class="mini-value" id="statItems">0</p>
          <p class="mini-label">รายการในคลัง</p>
        </div>
      </div>
      <div class="col-4">
        <div class="card-box mini">
          <i class="bi bi-fire"></i>
          <p class="mini-value" id="statStreak">0 วัน</p>
          <p class="mini-label">เล่นติดต่อกัน</p>
        </div>
      </div>
      <div class="col-4">
        <div class="card-box mini">
          <i class="bi bi-bullseye"></i>
          <p class="mini-value" id="statAcc">-</p>
          <p class="mini-label">ตอบถูกรวม</p>
        </div>
      </div>
    </section>

    <!-- กราฟแท่ง 7 วันล่าสุด -->
    <section class="card-box">
      <p class="chart-title">7 วันล่าสุด</p>
      <p class="chart-sub">จำนวนรอบที่เล่นในแต่ละวัน</p>
      <div class="bars" id="bars" role="img" aria-label="กราฟจำนวนรอบที่เล่น 7 วันล่าสุด"></div>
    </section>

  </main>

  <!-- ================= [ส่วนกลาง] Bottom Navbar ================= -->
  <nav class="dock" aria-label="เมนูหลัก">
    <span class="dock-pill" aria-hidden="true"></span>
    <a class="dock-item" href="index.html"><i class="bi bi-house-door"></i><span class="lbl">หลัก</span></a>
    <a class="dock-item" href="game.html"><i class="bi bi-controller"></i><span class="lbl">เล่นเกม</span></a>
    <a class="dock-item" href="lessons.html"><i class="bi bi-journal-text"></i><span class="lbl">บทเรียน</span></a>
    <a class="dock-item" href="stats.html"><i class="bi bi-bar-chart-line"></i><span class="lbl">สถิติ</span></a>
    <a class="dock-item" href="add.html"><i class="bi bi-plus-circle"></i><span class="lbl">เพิ่ม</span></a>
  </nav>

  <!-- ============================================================
       JavaScript
       ส่วน [ส่วนกลาง] = ระบบ navbar ใช้เหมือนกันทุกหน้า
       ส่วน [เฉพาะหน้า] = อ่านข้อมูลมาแสดงสถิติ
       ============================================================ -->
  <script>
    /* ---------- [ส่วนกลาง] ระบบ Bottom Navbar ---------- */
    (function () {
      const dock  = document.querySelector('.dock');
      const pill  = dock.querySelector('.dock-pill');
      const items = [...dock.querySelectorAll('.dock-item')];

      // หาว่าตอนนี้อยู่หน้าไหน จากชื่อไฟล์ (ไม่ต้องแก้อะไรตอนคัดลอกไปหน้าอื่น)
      const file = (location.pathname.split('/').pop() || 'index.html').toLowerCase();
      let cur = items.findIndex(a => a.getAttribute('href').toLowerCase() === file);
      if (cur < 0) cur = 0;

      function setActive(i) {
        items.forEach((a, j) => {
          a.classList.toggle('active', j === i);
          if (j === i) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
        });
        pill.style.transform = `translateX(${i * 100}%)`;
      }

      // ตั้งตำแหน่งเริ่มต้นทันที (ไม่ต้องมีแอนิเมชัน)
      pill.style.transition = 'none';
      setActive(cur);
      pill.offsetWidth; // บังคับให้เบราว์เซอร์คำนวณตำแหน่งก่อน
      pill.style.transition = '';

      function ripple(el, e) {
        const r = el.getBoundingClientRect();
        const size = Math.max(r.width, r.height) * 1.6;
        const s = document.createElement('span');
        s.className = 'ripple';
        s.style.cssText = `width:${size}px;height:${size}px;left:${e.clientX - r.left - size / 2}px;top:${e.clientY - r.top - size / 2}px`;
        el.appendChild(s);
        s.addEventListener('animationend', () => s.remove());
      }

      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

      items.forEach((a, i) => {
        a.addEventListener('pointerdown', e => ripple(a, e));
        a.addEventListener('click', e => {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return; // เปิดแท็บใหม่ตามปกติ
          e.preventDefault();
          if (i === cur) return;          // กดหน้าเดิม ไม่ต้องทำอะไร
          setActive(i);                   // ให้แคปซูลเลื่อนไปก่อน แล้วค่อยเปลี่ยนหน้า
          setTimeout(() => { location.href = a.href; }, reduce ? 0 : 260);
        });
      });

      // กดปุ่มย้อนกลับแล้วให้เมนูกลับมาถูกตำแหน่ง
      window.addEventListener('pageshow', e => { if (e.persisted) setActive(cur); });
    })();


    /* ---------- [เฉพาะหน้า] สถิติหน้าหลัก ---------- */
    (function () {
      // อ่านข้อมูลจาก localStorage (ถ้ายังไม่มีข้อมูล จะได้ array ว่าง)
      const read = k => {
        try { const v = JSON.parse(localStorage.getItem(k)); return Array.isArray(v) ? v : []; }
        catch (e) { return []; }
      };
      const items   = read('pjee_items');
      const history = read('pjee_history');

      const pad = n => String(n).padStart(2, '0');
      const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; // YYYY-MM-DD ตามเวลาเครื่อง

      // รวมผลตามวัน
      const byDay = {};
      let allTotal = 0, allCorrect = 0;
      history.forEach(h => {
        const k = String(h.date).slice(0, 10);
        const d = byDay[k] || (byDay[k] = { rounds: 0, total: 0, correct: 0 });
        d.rounds += 1;
        d.total += Number(h.total) || 0;
        d.correct += Number(h.correct) || 0;
        allTotal += Number(h.total) || 0;
        allCorrect += Number(h.correct) || 0;
      });

      const today = byDay[dayKey(new Date())];
      const pct = (c, t) => t > 0 ? Math.round(c / t * 100) + '%' : '-';

      // streak: นับย้อนหลังจากวันนี้ (ถ้าวันนี้ยังไม่เล่น เริ่มนับจากเมื่อวาน)
      let streak = 0;
      const d = new Date();
      if (!today) d.setDate(d.getDate() - 1);
      while (byDay[dayKey(d)]) { streak++; d.setDate(d.getDate() - 1); }

      // การ์ดวันนี้
      const heroMain = document.getElementById('heroMain');
      const heroSub  = document.getElementById('heroSub');
      const cta      = document.getElementById('cta');
      if (items.length === 0) {
        heroMain.textContent = 'ยังไม่มีคำในคลัง';
        heroSub.textContent  = 'เพิ่มคำหรือประโยคก่อน แล้วค่อยเล่นเกม';
        cta.textContent = 'เพิ่มคำแรก';
        cta.setAttribute('href', 'add.html');
      } else if (!today) {
        heroMain.textContent = 'ยังไม่ได้เล่น';
        heroSub.textContent  = 'ลองเล่นสัก 1 รอบวันนี้';
      } else {
        heroMain.textContent = `เล่นแล้ว ${today.rounds} รอบ`;
        heroSub.textContent  = `ตอบถูก ${pct(today.correct, today.total)}`;
      }

      // การ์ดตัวเลขย่อย
      document.getElementById('statItems').textContent  = items.length;
      document.getElementById('statStreak').textContent = streak + ' วัน';
      document.getElementById('statAcc').textContent    = pct(allCorrect, allTotal);

      // กราฟ 7 วันล่าสุด
      const dayNames = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const dt = new Date(); dt.setDate(dt.getDate() - i);
        days.push({ name: dayNames[dt.getDay()], rounds: (byDay[dayKey(dt)] || {}).rounds || 0, isToday: i === 0 });
      }
      const max = Math.max(1, ...days.map(x => x.rounds));
      const barsEl = document.getElementById('bars');
      const barEls = [];
      days.forEach(x => {
        const col = document.createElement('div');
        col.className = 'bar-col' + (x.isToday ? ' is-today' : '');
        col.innerHTML = '<span class="bar-val"></span><div class="bar"></div><span class="bar-day"></span>';
        col.querySelector('.bar-val').textContent = x.rounds > 0 ? x.rounds : '';
        col.querySelector('.bar-day').textContent = x.name;
        const bar = col.querySelector('.bar');
        if (x.rounds === 0) bar.classList.add('zero');
        if (x.isToday && x.rounds > 0) bar.classList.add('today');
        barsEl.appendChild(col);
        barEls.push([bar, x.rounds]);
      });
      // ให้แท่งค่อยๆ ยืดขึ้นตอนโหลดหน้า
      requestAnimationFrame(() => requestAnimationFrame(() => {
        barEls.forEach(([bar, r]) => { if (r > 0) bar.style.height = Math.max(8, r / max * 100) + '%'; });
      }));
    })();
  </script>
</body>
</html>
